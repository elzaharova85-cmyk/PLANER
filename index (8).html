<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Планер">
<meta name="theme-color" content="#1F5F8B">
<title>Планер</title>
<style>
  html,body{margin:0;height:100%;background:#F3F5F8;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#16202B}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}
  .setup{max-width:480px;margin:0 auto;padding:48px 16px;display:flex;flex-direction:column;gap:14px}
  .setup h1{margin:0;font-size:22px}
  .setup p{margin:0;color:#5A6777;line-height:1.5}
  .setup input{padding:12px;border:1px solid #D9DFE7;border-radius:10px;font-size:15px}
  .setup button{padding:12px;border:0;border-radius:10px;background:#1F5F8B;color:#fff;font-size:15px;font-weight:600;cursor:pointer}
  .err{color:#B0472C;font-size:14px}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div class="setup" id="setup" hidden>
  <h1>Планер</h1>
  <p>Вставьте секретную ссылку на планер. Её показывает функция <b>plannerLink</b> в редакторе Apps Script. Ссылка сохранится только на этом устройстве — вводить её нужно один раз.</p>
  <input id="url" placeholder="https://script.google.com/macros/s/.../exec?key=..." autocomplete="off">
  <div class="err" id="err" hidden>Ссылка должна начинаться с https://script.google.com/ и содержать ?key=</div>
  <button id="save">Сохранить и открыть</button>
</div>
<script>
  // Ссылка хранится только в браузере этого устройства, в коде страницы её нет.
  var KEY = 'planner-url';
  if (location.search.indexOf('reset') >= 0) { try { localStorage.removeItem(KEY); } catch (e) {} }
  var url = null;
  try { url = localStorage.getItem(KEY); } catch (e) {}
  function open(u) {
    var f = document.createElement('iframe');
    f.src = u;
    f.setAttribute('allow', 'clipboard-read; clipboard-write');
    document.body.appendChild(f);
  }
  if (url) open(url);
  else {
    document.getElementById('setup').hidden = false;
    document.getElementById('save').onclick = function () {
      var u = document.getElementById('url').value.trim();
      if (!/^https:\/\/script\.google\.com\//.test(u) || u.indexOf('key=') < 0) { document.getElementById('err').hidden = false; return; }
      try { localStorage.setItem(KEY, u); } catch (e) {}
      document.getElementById('setup').hidden = true;
      open(u);
    };
  }
</script>
</body>
</html>
